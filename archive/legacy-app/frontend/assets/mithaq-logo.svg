<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="شعار ميثاق — كوفي مربع">
  <!--
    Square (Kufic) seal for ميثاق.
    Palette: Black #111827, Gold #D97706, White #FFFFFF.
    The word مِيثَاق is drawn as square-grid letter blocks:
      م (right column)  ي (mid-right)  ث (center, with dots)  ا (left bar)  ق (far left, with dots)
    Read right-to-left inside a solid black square with a gold keyline.
  -->
  <!-- seal plate -->
  <rect x="2" y="2" width="96" height="96" rx="10" fill="#111827"/>
  <rect x="2" y="2" width="96" height="96" rx="10" fill="none" stroke="#D97706" stroke-width="3"/>
  <!-- inner gold keyline frame -->
  <rect x="9" y="9" width="82" height="82" rx="5" fill="none" stroke="#D97706" stroke-width="1.5" opacity="0.55"/>

  <!-- letter blocks (grid unit = 4) -->
  <g fill="#FFFFFF">
    <!-- م : vertical stem + square bowl (rightmost) -->
    <rect x="76" y="26" width="6" height="30"/>
    <rect x="70" y="50" width="12" height="6"/>
    <rect x="70" y="44" width="6" height="6"/>

    <!-- ي : base stroke with two ascending teeth -->
    <rect x="58" y="56" width="6" height="18"/>
    <rect x="52" y="56" width="12" height="6"/>
    <rect x="58" y="38" width="6" height="12"/>
    <rect x="58" y="30" width="6" height="4"/>

    <!-- ث : center column with three-dot crown bowl -->
    <rect x="40" y="30" width="6" height="44"/>
    <rect x="34" y="30" width="12" height="6"/>
    <rect x="34" y="42" width="12" height="6"/>
    <rect x="34" y="54" width="12" height="6"/>

    <!-- ا : plain vertical bar -->
    <rect x="24" y="30" width="6" height="44"/>

    <!-- ق : left column with bowl + double-dot base -->
    <rect x="12" y="30" width="6" height="30"/>
    <rect x="12" y="54" width="12" height="6"/>
    <rect x="12" y="66" width="12" height="6"/>
  </g>

  <!-- letter dots (gold) -->
  <g fill="#D97706">
    <!-- ث : three dots above the crown -->
    <rect x="40" y="22" width="4" height="4"/>
    <rect x="46" y="22" width="4" height="4"/>
    <rect x="52" y="22" width="4" height="4"/>
    <!-- ق : two dots above the bowl -->
    <rect x="14" y="22" width="4" height="4"/>
    <rect x="20" y="22" width="4" height="4"/>
  </g>

  <!-- gold baseline anchor (bottom center) -->
  <rect x="42" y="82" width="16" height="3" fill="#D97706"/>
</svg>
