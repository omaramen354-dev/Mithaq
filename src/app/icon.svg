  <!-- رسم اللوغو (حرف الميم الكوفي) مبسطاً ومتمركزاً -->
  <g fill="#D4A843">
    <rect x="38" y="46" width="104" height="22" rx="4"/>
    <rect x="38" y="80" width="30" height="22" rx="4"/>
    <rect x="112" y="80" width="30" height="22" rx="4"/>
    <rect x="82" y="80" width="16" height="22" rx="4"/>
    <rect x="38" y="114" width="104" height="22" rx="4"/>
  </g>
</svg>
