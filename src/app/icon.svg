<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D4A3E"/>
      <stop offset="1" stop-color="#071F1A"/>
    </linearGradient>
  </defs>
  <!-- خلفية زمردية بزوايا مستديرة — مظهر تطبيق حديث -->
  <rect width="180" height="180" rx="42" fill="url(#bg)"/>
  <!-- إطار داخلي ذهبي رفيع -->
